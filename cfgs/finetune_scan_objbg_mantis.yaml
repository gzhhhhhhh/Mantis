optimizer: {
  type: AdamW,
  part: only_new,
  kwargs: {
    lr: 0.0005,
    weight_decay: 0.05
  } }

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs: 10
  } }

dataset: {
  train: { _base_: cfgs/dataset_configs/ScanObjectNN_objectbg.yaml,
           others: { subset: 'train' } },
  val: { _base_: cfgs/dataset_configs/ScanObjectNN_objectbg.yaml,
         others: { subset: 'test' } },
  test: { _base_: cfgs/dataset_configs/ScanObjectNN_objectbg.yaml,
          others: { subset: 'test' } } }

model: {
  NAME: Mantis,
  trans_dim: 384,
  depth: 12,
  drop_path_rate: 0.1,
  cls_dim: 15,
  num_heads: 6,
  group_size: 32,
  num_group: 128,
  encoder_dims: 384,
  bimamba_type: "v4",
  center_local_k: 4,
  ordering: False,
  label_smooth: 0.0,
  peft: {
    freeze_backbone: True,
    enable_saa: True,
    enable_dscd: True,
    saa: {
      rank: 8,
      control_dim: 64,
      target_layers: all,
      modulate_dt: True,
      modulate_B: True,
      modulate_C: True,
      modulate_A: False,
      disable_fast_path: True
    },
    dscd: {
      orders: [x, y],
      proj_dim: 128,
      feat_loss: cosine,
      temperature: 2.0
    }
  }
}

loss: {
  task_weight: 1.0,
  feat_cons_weight: 1.0,
  pred_cons_weight: 0.5,
  ctrl_weight: 0.0,
  stability_weight: 0.0
}

npoints: 2048
total_bs: 32
step_per_update: 1
max_epoch: 300
grad_norm_clip: 10
