optimizer: {
  type: AdamW,
  kwargs: {
    lr: 0.0002,
    weight_decay: 0.05
  } }

scheduler: {
  type: CosLR,
  kwargs: {
    epochs: 300,
    initial_epochs: 10
  } }

dataset: {
  train: { _base_: cfgs/dataset_configs/ShapeNetPart.yaml,
           others: { subset: 'trainval' } },
  val: { _base_: cfgs/dataset_configs/ShapeNetPart.yaml,
         others: { subset: 'test' } },
  test: { _base_: cfgs/dataset_configs/ShapeNetPart.yaml,
          others: { subset: 'test' } } }

model: {
  NAME: Mamba3DPartSeg,
  trans_dim: 384,
  depth: 12,
  drop_path_rate: 0.2,
  cls_dim: 50,
  num_part: 50,
  num_classes: 16,
  num_heads: 6,
  group_size: 32,
  num_group: 128,
  encoder_dims: 384,
  bimamba_type: "v4",
  center_local_k: 4,
  ordering: False,
  label_smooth: 0.0,
  fetch_idx: [3, 7, 11],
  seg_channels: [512, 256],
  seg_dropout: 0.5
}

loss: {
  task_weight: 1.0,
  feat_cons_weight: 0.0,
  pred_cons_weight: 0.0,
  ctrl_weight: 0.0,
  stability_weight: 0.0
}

npoints: 2048
total_bs: 16
step_per_update: 1
max_epoch: 300
grad_norm_clip: 10
